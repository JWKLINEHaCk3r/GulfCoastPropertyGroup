# Alembic Configuration
# Database migration tool for SQLAlchemy

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(asctime)s_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to zoneinfo.ZoneInfo()
# defaults to the local timezone
#timezone =

# max length of characters to apply to the
# "slug" field of the migration file
# when using the "slug" template
# defaults to 40
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# allow_zero_version = false

# naming convention used by the alembic operations context
# to determine the name of indexes, constraints, etc.
# defaults to ""
naming_convention = %(constraint)s

[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# The output encoding used. This is configurable because some systems have
# non-UTF8 as the default for sys.stdout.output_encoding. The default value is utf-8.
#output_encoding = utf-8

[sqlalchemy]
# examples of different database urls you may use in development:
#   postgresql://user:password@127.0.0.1/databasename
#   mysql://user:password@127.0.0.1/databasename
#   sqlite:///filename.db
#   driver://user:password@dbhost/dbname
sqlalchemy.url = postgresql://localhost/gulf_coast

# Add your source code root to the Python path. This way you can import
# modules from your source code when writing migration scripts.
pythonpath = .

[loggers]
keys = root,sqlalchemy.engine,sqlalchemy.pool

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_sqlalchemy.pool]
level = WARN
handlers =
qualname = sqlalchemy.pool

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

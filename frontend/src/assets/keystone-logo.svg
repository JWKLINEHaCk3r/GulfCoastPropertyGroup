<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background glow -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ccff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Glow background -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGlow)"/>
  
  <!-- Shield base -->
  <path d="M 200 80 L 280 120 L 280 200 Q 200 280 200 280 Q 120 280 120 200 L 120 120 Z" 
        fill="url(#shieldGradient)" stroke="#00ffffff" stroke-width="2"/>
  
  <!-- Shield highlight -->
  <path d="M 200 100 L 270 135 L 270 200 Q 200 260 200 260 Q 140 260 140 200 L 140 135 Z" 
        fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  
  <!-- Buildings inside shield -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8">
    <!-- Left building -->
    <rect x="160" y="140" width="20" height="80"/>
    <rect x="165" y="145" width="10" height="10" fill="#ffffff"/>
    <rect x="165" y="160" width="10" height="10" fill="#ffffff"/>
    <rect x="165" y="175" width="10" height="10" fill="#ffffff"/>
    
    <!-- Center building (taller) -->
    <rect x="190" y="110" width="20" height="110"/>
    <rect x="195" y="115" width="10" height="10" fill="#ffffff"/>
    <rect x="195" y="135" width="10" height="10" fill="#ffffff"/>
    <rect x="195" y="155" width="10" height="10" fill="#ffffff"/>
    <rect x="195" y="175" width="10" height="10" fill="#ffffff"/>
    <rect x="195" y="195" width="10" height="10" fill="#ffffff"/>
    
    <!-- Right building -->
    <rect x="220" y="155" width="20" height="65"/>
    <rect x="225" y="160" width="10" height="10" fill="#ffffff"/>
    <rect x="225" y="180" width="10" height="10" fill="#ffffff"/>
  </g>
  
  <!-- Orbital rings (velocity) -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.6" stroke-dasharray="5,5"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#0066ff" stroke-width="1" opacity="0.4" stroke-dasharray="3,7"/>
  
  <!-- Arrow (velocity indicator) -->
  <g stroke="#00ccff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 240 150 L 300 110 L 280 130"/>
  </g>
</svg>
